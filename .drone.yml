kind: pipeline
type: docker
name: docker-compose-deploy

steps:
  - name: build
    image: docker:20.10
    commands:
      - docker-compose build
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
  - name: prod
    image: alpine
    environment:
      SSH_KEY:
        from_secret: ssh_key
    commands:
      - apk add openssh
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh -o StrictHostKeyChecking=no thek4n@192.168.50.5 "cd ~/projects/ip.thek4n.name && docker compose up -d"


volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock
